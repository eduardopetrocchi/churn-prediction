[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "Sistema de predição de churn com MLOps"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Seu Nome", email = "seu.email@exemplo.com"}
]
dependencies = [
    "dagshub==0.5.9",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.6.1",
    "tensorflow==2.19.0",
    "keras==3.13.1",
    "pyyaml==6.0.2",
    "joblib==1.5.3",
    "mlflow==2.22.1",
    "python-dotenv==1.1.0",
    "dvc==3.66.1",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.22"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
predict-churn = "src.main:main"
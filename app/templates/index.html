<!DOCTYPE html>
<html>
<head>
    <title>Churn Prediction</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        .options {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .option-card {
            flex: 1;
            padding: 30px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .option-card .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .option-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .option-card p {
            color: #666;
            font-size: 14px;
        }
        .option-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Churn Prediction System</h1>
        <p class="subtitle">Escolha como deseja fazer a predição</p>
        
        <div class="options">
            <div class="option-card">
                <a href="/form">
                    <div class="icon">👤</div>
                    <h2>Cliente Individual</h2>
                    <p>Preencha o formulário com os dados de um cliente</p>
                </a>
            </div>
            
            <div class="option-card">
                <a href="/upload">
                    <div class="icon">📄</div>
                    <h2>Upload CSV</h2>
                    <p>Faça predição em lote enviando um arquivo CSV</p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

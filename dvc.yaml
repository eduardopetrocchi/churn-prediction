stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw/telco.csv
      - src/data/prepare.py
      - params.yaml
    params:
      - data.test_size
      - data.random_state
    outs:
     - data/processed/train.csv
     - data/processed/test.csv
     - models/preprocessor.pkl
  
  train:
    cmd: python -m src.model.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/model/model_training.py
      - models/preprocessor.pkl
      - params.yaml
      - src/model/train.py
    params:
      - model.hidden_layers
      - model.dropout
      - model.learning_rate
      - model.epochs
      - model.batch_size
      - model.patience
    outs:
      - models/model.keras
    metrics:
      - metrics/training.json:
          cache: false
  
  evaluate:
    cmd: python -m src.model.evaluation
    deps:
     - data/processed/test.csv
     - models/model.keras
     - models/preprocessor.pkl
     - src/model/evaluation.py
    outs:
      - metrics/plots/confusion_matrix.png:
          cache: false
      - metrics/plots/roc_curve.png:
          cache: false
    metrics:
      - metrics/evaluation.json:
          cache: false


